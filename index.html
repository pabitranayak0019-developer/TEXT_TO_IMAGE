<!DOCTYPE html>
<html lang="en" data-bs-theme="dark">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Visionary | AI Text-to-Image Generator</title>
    
    <!-- Bootstrap 5 CSS -->
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
    <!-- Bootstrap Icons -->
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.min.css">
    <!-- Google Fonts -->
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600&family=Space+Grotesk:wght@600;700&display=swap" rel="stylesheet">
    
    <link rel="stylesheet" href="style.css">
</head>
<body class="bg-main text-body">

    <!-- 3D Vanta Background Canvas Layer -->
    <div id="vanta-bg"></div>

    <div class="container py-4 min-vh-100 d-flex flex-column justify-content-between position-relative z-1" style="max-width: 850px;">
        
        <!-- Header -->
        <header class="d-flex justify-content-between align-items-center mb-4">
            <div class="d-flex align-items-center gap-2">
                <i class="bi bi-stars fs-3 text-primary"></i>
                <h1 class="h3 mb-0 fw-bold font-heading">AI IMAGE GENERATOR
                </h1>
            </div>
            <button id="theme-toggle" class="btn btn-outline-secondary rounded-circle d-flex align-items-center justify-content-center p-2" style="width: 42px; height: 42px;" title="Toggle Theme">
                <i class="bi bi-sun-fill sun-icon"></i>
                <i class="bi bi-moon-stars-fill moon-icon d-none"></i>
            </button>
        </header>

        <main class="d-flex flex-column gap-4">
            <!-- Input & Configuration Section -->
            <section class="card glass-card border-0 rounded-4 shadow-lg p-4">
                <div class="mb-3">
                    <label for="prompt" class="form-label text-secondary font-monospace small">DESCRIBE YOUR IMAGINATION</label>
                    <textarea id="prompt" class="form-class-custom form-control border-0 rounded-3 p-3" rows="4" placeholder="A futuristic cyberpunk city with neon rain and floating gardens, digital art, 8k resolution..."></textarea>
                </div>

                <!-- Selectors: Dimension & Model Engine -->
                <div class="row g-3 mb-4">
                    <div class="col-12 col-md-6">
                        <label for="dimension-select" class="form-label text-secondary font-monospace small">DIMENSION / ASPECT RATIO</label>
                        <select id="dimension-select" class="form-class-custom form-select border-0 rounded-3 p-2 px-3">
                            <option value="1024x1024" selected>1:1 Square (1024x1024)</option>
                            <option value="1280x720">16:9 Landscape (1280x720)</option>
                            <option value="720x1280">9:16 Portrait (720x1280)</option>
                            <option value="1024x768">4:3 Standard (1024x768)</option>
                        </select>
                    </div>
                    <div class="col-12 col-md-6">
                        <label for="model-select" class="form-label text-secondary font-monospace small">MODEL ENGINE</label>
                        <select id="model-select" class="form-class-custom form-select border-0 rounded-3 p-2 px-3">
                            <option value="flux" selected>Flux (Balanced / High Detail)</option>
                            <option value="flux-realism">Flux Realism (Photorealistic)</option>
                            <option value="flux-anime">Flux Anime (Artistic / Anime)</option>
                            <option value="flux-3d">Flux 3D (3D Rendered)</option>
                            <option value="turbo">Turbo (Fast Generation)</option>
                        </select>
                    </div>
                </div>

                <div class="d-flex flex-column flex-sm-row justify-content-between align-items-sm-center gap-3">
                    <div class="d-flex gap-2">
                        <button id="clear-btn" class="btn btn-outline-secondary rounded-3 px-3">
                            <i class="bi bi-trash3 me-1"></i> Clear
                        </button>
                        <button id="copy-btn" class="btn btn-outline-secondary rounded-3 px-3">
                            <i class="bi bi-clipboard me-1"></i> Copy
                        </button>
                    </div>
                    <button id="generate-btn" class="btn btn-primary-gradient rounded-3 px-4 py-2 d-flex align-items-center justify-content-center gap-2">
                        <span class="btn-text">Generate Image</span>
                        <span class="spinner-border spinner-border-sm d-none" role="status" aria-hidden="true"></span>
                    </button>
                </div>
            </section>

            <!-- Output Section -->
            <section class="card glass-card border-0 rounded-4 shadow-lg p-3 text-center position-relative min-vh-50 d-flex justify-content-center align-items-center">
                
                <div id="image-container" class="w-100 h-100 d-flex justify-content-center align-items-center rounded-3 overflow-hidden position-relative">
                    
                    <!-- Placeholder -->
                    <div class="placeholder-box text-secondary py-5">
                        <i class="bi bi-image fs-1 mb-2 d-block opacity-50"></i>
                        <p class="mb-0">Your masterpiece will appear here</p>
                    </div>

                    <!-- Generated Image -->
                    <img id="generated-image" src="" alt="AI Output" class="img-fluid rounded-3 d-none w-100 object-fit-contain" style="max-height: 550px;">

                    <!-- Action Overlay -->
                    <div id="image-actions" class="position-absolute bottom-0 end-0 p-3 d-none">
                        <button id="download-btn" class="btn btn-dark btn-sm rounded-pill backdrop-blur px-3 py-2 border border-secondary shadow">
                            <i class="bi bi-download me-1"></i> Download
                        </button>
                    </div>
                </div>

                <!-- Error Alert Box -->
                <div id="error-display" class="alert alert-danger border-danger-subtle d-flex align-items-center gap-2 mt-3 mb-0 w-100 d-none" role="alert">
                    <i class="bi bi-exclamation-triangle-fill fs-5"></i>
                    <span id="error-text">Something went wrong. Please try again.</span>
                </div>
            </section>
        </main>

        <!-- Footer -->
        <footer class="text-center text-secondary small py-3 mt-4">
            <p class="mb-0">Powered by Pollinations AI &bull; Creating the unseen</p>
        </footer>
    </div>

    <!-- 3D Vanta Animation Scripts -->
    <script src="https://cdnjs.cloudflare.com/ajax/libs/three.js/r134/three.min.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/vanta@latest/dist/vanta.dots.min.js"></script>
    
    <!-- Bootstrap JS Bundle -->
    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
    <script src="script.js"></script>
</body>
</html>
